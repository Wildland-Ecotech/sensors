# What a Wetfish server asks for when sensors is added to it; see
# docs/deploying.md. sensors.env starts as a copy of sensors.env.example,
# whose values are offered as the answers.
#
# <env file> <variable> <value>
sensors.env SENSORS_TIME_ZONE ask Time zone to show times in, such as America/Denver
sensors.env SENSORS_NICK      ask Nick for the bot on IRC
