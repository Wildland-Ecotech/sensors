[package]
name = "sensors"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Graphs readings that sensors post to IRC, from irssi logs or live"
repository = "https://github.com/Wildland-Ecotech/sensors"
license-file = "LICENSE"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = { version = "0.3.34", default-features = false }
irc = { version = "1.1.0", default-features = false, features = ["ctcp", "tls-rust"] }
maud = { version = "0.27", features = ["axum"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["macros", "net", "rt", "signal", "time"] }
