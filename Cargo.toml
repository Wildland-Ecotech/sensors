[package]
name = "sensors"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Graphs readings that sensors post to IRC, from irssi logs"
repository = "https://github.com/Wildland-Ecotech/sensors"
license-file = "LICENSE"

[dependencies]
axum = "0.8.9"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
clap = { version = "4.6", features = ["derive"] }
maud = { version = "0.27", features = ["axum"] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.54", features = ["rt", "net"] }
